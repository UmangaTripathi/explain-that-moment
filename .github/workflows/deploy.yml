name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  backend:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Roll out new revision
        run: |
          az containerapp ingress update -g "${{ vars.AZURE_RG }}" -n "${{ vars.BACKEND_APP }}" --target-port 8000 -o none
          az containerapp update -g "${{ vars.AZURE_RG }}" -n "${{ vars.BACKEND_APP }}" \
            --image "$IMAGE" --set-env-vars APP_VERSION=${GITHUB_SHA::7} \
            --min-replicas 1 --max-replicas 1 -o none

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.BACKEND_URL }}/health" | grep -q "${GITHUB_SHA::7}"; then
              echo "Backend healthy on ${GITHUB_SHA::7}"; exit 0
            fi
            sleep 15
          done
          echo "Backend did not become healthy"; exit 1

  frontend:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}
        run: npm ci && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
