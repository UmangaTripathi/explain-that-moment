name: Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Keep the currently running image so re-applying infra never rolls back the app.
      - name: Read current backend image
        run: |
          IMAGE=$(az containerapp show -g "${{ vars.AZURE_RG }}" -n "${{ vars.BACKEND_APP }}" \
            --query "properties.template.containers[0].image" -o tsv)
          PORT=$(az containerapp show -g "${{ vars.AZURE_RG }}" -n "${{ vars.BACKEND_APP }}" \
            --query "properties.configuration.ingress.targetPort" -o tsv)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "PORT=$PORT" >> "$GITHUB_ENV"

      - name: What-if
        run: |
          az deployment group what-if -g "${{ vars.AZURE_RG }}" -f infra/main.bicep \
            -p backendImage="$IMAGE" backendPort="$PORT" budgetEmail="${{ secrets.BUDGET_EMAIL }}"

      - name: Deploy
        run: |
          az deployment group create -g "${{ vars.AZURE_RG }}" -f infra/main.bicep \
            -p backendImage="$IMAGE" backendPort="$PORT" budgetEmail="${{ secrets.BUDGET_EMAIL }}" -o none
